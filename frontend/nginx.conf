server {
    listen 80;
    server_name localhost;

    # 前端静态页面
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    # /api 请求转发给 backend 容器（容器间用服务名互访，这是 compose 内置的 DNS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # 智能体响应慢，放宽超时
        proxy_buffering off;       # 关键：关闭缓冲才能正常转发 SSE 流式响应
    }
}
