server {
    listen 80;
    server_name localhost;

    # 前端静态页面
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # HTML 不缓存：否则浏览器启发式缓存会一直用旧 index.html，
        # 重新部署后页面仍加载旧 JS（本次双气泡 bug 复现的原因）
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源内容不变，可长缓存
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api 请求转发给 backend 容器（容器间用服务名互访，这是 compose 内置的 DNS）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;   # 智能体响应慢，放宽超时
        proxy_buffering off;       # 关键：关闭缓冲才能正常转发 SSE 流式响应
    }
}
